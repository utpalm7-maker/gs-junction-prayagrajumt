<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS JUNCTION PRAYAGRAJ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- STUDENT LOGIN MODAL -->
    <div id="studentLoginModal" class="modal-overlay hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:25px; border-radius:10px; width:90%; max-width:400px;">
            <h2>GS JUNCTION लॉगिन</h2>
            <form onsubmit="handleStudentLogin(event)">
                <input type="text" id="regStudentName" placeholder="नाम" required style="width:100%; padding:10px; margin-bottom:10px;">
                <input type="tel" id="regStudentMobile" placeholder="मोबाइल नंबर" required style="width:100%; padding:10px; margin-bottom:10px;">
                <input type="text" id="regStudentCity" placeholder="शहर" required style="width:100%; padding:10px; margin-bottom:10px;">
                <button type="submit" class="btn btn-primary" style="width:100%;">प्रवेश करें</button>
            </form>
        </div>
    </div>

    <!-- ADMIN LOGIN MODAL -->
    <div id="adminLoginModal" class="modal-overlay hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:25px; border-radius:10px; width:90%; max-width:400px;">
            <h2>Admin Secure Login</h2>
            <input type="text" id="adminUserField" placeholder="Admin ID" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="password" id="adminPassField" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="btn btn-success" onclick="handleAdminAuth()" style="width:100%;">लॉगिन</button>
            <button class="btn btn-outline" onclick="closeAdminLoginModal()" style="width:100%; margin-top:10px;">रद्द करें</button>
        </div>
    </div>

    <header class="app-header">
        <h1 id="brandTitleText">GS JUNCTION PRAYAGRAJ</h1>
        <button id="toggleAuthBtn" class="btn btn-outline" onclick="triggerAdminAccess()">Admin Login</button>
    </header>

    <main class="main-container">
        <!-- यहाँ बाकी सारा आपका पुराना कोड वैसे ही रहेगा -->
        <div id="studentInterface" class="interface-section active">
            <!-- (यहाँ आपका पुराना टैब्स और डैशबोर्ड कोड आएगा) -->
        </div>
        <div id="adminInterface" class="interface-section">
            <!-- (यहाँ आपका एडमिन डैशबोर्ड कोड आएगा) -->
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // PWA Auto-Update Script
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(console.error);
        }
    </script>
</body>
</html>
